version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beauty_bond
    ports: ['5432:5432']
    volumes: ['bb_pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/beauty_bond
      REDIS_URL: redis://redis:6379
    env_file: [../../.env]
    ports: ['4000:4000']

volumes:
  bb_pgdata:
