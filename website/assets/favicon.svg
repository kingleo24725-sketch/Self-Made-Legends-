<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Self-Made Legends">
  <title>Self-Made Legends</title>
  <!--
    The house seal, distilled for tiny sizes.

    The ring text and laurels are dropped on purpose: at 16px they turn to
    noise and make the whole mark read as a smudge. What survives is the
    silhouette that actually identifies the brand — gold ring, crown,
    monogram. At 16px it reads as "gold ring with a crown"; at 32px and up
    the SML comes through.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8A6B14"/>
      <stop offset="26%"  stop-color="#C9A227"/>
      <stop offset="48%"  stop-color="#F2DFA0"/>
      <stop offset="70%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8A6B14"/>
    </linearGradient>
  </defs>

  <!-- ground: painted, so the mark holds on a light or dark browser tab -->
  <rect width="64" height="64" rx="10" fill="#06060A"/>

  <!-- outer ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#g)" stroke-width="2.6"/>

  <!-- crown — same geometry as the full seal, scaled up to survive -->
  <g transform="translate(32,23) scale(.34)">
    <path d="M-40 26 L-32 -2 L-14 12 L0 -12 L14 12 L32 -2 L40 26 Z"
          fill="none" stroke="url(#g)" stroke-width="7.5" stroke-linejoin="round"/>
    <circle cx="-32" cy="-5"  r="7"   fill="url(#g)"/>
    <circle cx="0"   cy="-15" r="8"   fill="url(#g)"/>
    <circle cx="32"  cy="-5"  r="7"   fill="url(#g)"/>
    <rect x="-40" y="31" width="80" height="10" fill="url(#g)"/>
  </g>

  <!-- monogram -->
  <text x="32" y="48.5" text-anchor="middle" fill="url(#g)"
        font-family="Bodoni Moda, Didot, Georgia, serif"
        font-size="14" font-weight="500" letter-spacing="1">SML</text>
</svg>
