<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Self-Made Legends seal">
  <title>Self-Made Legends</title>
  <defs>
    <linearGradient id="gf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8F6E15"/>
      <stop offset="22%"  stop-color="#CFA529"/>
      <stop offset="44%"  stop-color="#F6E4A6"/>
      <stop offset="64%"  stop-color="#CFA529"/>
      <stop offset="84%"  stop-color="#8F6E15"/>
