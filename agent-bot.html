<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Expense Insurance Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #1a1a1a;
            --gold: #d4af37;
            --white: #ffffff;
            --light-gray: #f5f5f5;
            --dark-gray: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 100%);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background-color: var(--dark-gray);
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(212, 175, 55, 0.3);
            border: 2px solid var(--gold);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--gold), #c99a1f);
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            color: var(--black);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--black);
            font-size: 0.95rem;
        }

        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            display: flex;
            margin-bottom: 1rem;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-text {
            max-width: 85%;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.bot .message-text {
            background-color: var(--black);
            color: var(--gold);
            border-left: 3px solid var(--gold);
        }

        .message.user .message-text {
            background-color: var(--gold);
            color: var(--black);
            font-weight: 500;
        }

        .input-section {
            padding: 1.5rem 2rem;
            background-color: var(--black);
            border-top: 2px solid var(--gold);
        }

        .input-wrapper {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select {
            flex: 1;
            padding: 0.8rem;
            background-color: var(--dark-gray);
            border: 1px solid var(--gold);
            border-radius: 8px;
            color: var(--white);
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--white);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        .button-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.8rem 1.5rem;
            background-color: var(--gold);
            color: var(--black);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
        }

        button:hover {
            background-color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background-color: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
        }

        button.secondary:hover {
            background-color: var(--gold);
            color: var(--black);
        }

        .success-section {
            padding: 2rem;
            text-align: center;
            display: none;
        }

        .success-section.show {
            display: block;
        }

        .success-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: bounceIn 0.5s ease-out;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .success-section h2 {
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .success-section p {
            color: var(--light-gray);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .json-output {
            background-color: var(--black);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
        }

        .json-output pre {
            color: var(--gold);
            font-size: 0.85rem;
            line-height: 1.4;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .copy-button {
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }

        .reset-button {
            width: 100%;
            margin-top: 1rem;
        }

        .scroll-prompt {
            text-align: center;
            color: var(--gold);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
                border-radius: 8px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .chat-box {
                height: 350px;
                padding: 1.5rem;
            }

            .message-text {
                font-size: 0.9rem;
                padding: 0.8rem 1rem;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Final Expense Insurance Assistant</h1>
            <p>Your path to simple, affordable protection</p>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-section" id="inputSection">
            <div class="input-wrapper" id="inputWrapper"></div>
            <div class="button-group" id="buttonGroup"></div>
            <div class="scroll-prompt" id="scrollPrompt">↓ Scroll for more</div>
        </div>

        <div class="success-section" id="successSection">
            <div class="success-icon">✓</div>
            <h2>Thank You!</h2>
            <p>I've received your information. I will review it and send your quote shortly. Your details have been saved.</p>

            <h3 style="color: var(--gold); margin-top: 1.5rem; margin-bottom: 1rem;">Your Information (JSON Format)</h3>
            <div class="json-output">
                <pre id="jsonOutput"></pre>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button class="copy-button" onclick="copyToClipboard()">📋 Copy JSON</button>
                <button class="copy-button secondary" onclick="resetBot()">🔄 Start Over</button>
            </div>
        </div>
    </div>

    <script>
        // Bot State
        const botData = {
            age: null,
            gender: null,
            smoker_status: null,
            health_conditions: null,
            coverage_amount: null,
            full_name: null,
            phone_number: null,
            email_address: null,
            currentStep: 0
        };

        const questions = [
            {
                type: 'number',
                question: "First, how old are you?",
                key: 'age',
                input: 'age',
                min: 40,
                max: 100
            },
            {
                type: 'choice',
                question: "Thank you. Are you male or female?",
                key: 'gender',
                options: ['Male', 'Female', 'Prefer not to say']
            },
            {
                type: 'choice',
                question: "Got it. Do you smoke?",
                key: 'smoker_status',
                options: ['Yes', 'No']
            },
            {
                type: 'choice',
                question: "Understood. Do you have any major health conditions such as heart disease, cancer, COPD, or anything similar?",
                key: 'health_conditions',
                options: ['Yes', 'No']
            },
            {
                type: 'choice',
                question: "Thanks. How much coverage would you like? Most people choose between $10,000 and $25,000.",
                key: 'coverage_amount',
                options: ['$5,000', '$10,000', '$15,000', '$20,000', '$25,000']
            },
            {
                type: 'contact',
                question: "Great. Lastly, what is your full name, phone number, and email so I can send your personalized quote?",
                fields: [
                    { key: 'full_name', label: 'Full Name', type: 'text', placeholder: 'Enter your full name' },
                    { key: 'phone_number', label: 'Phone Number', type: 'tel', placeholder: 'Enter your phone number' },
                    { key: 'email_address', label: 'Email Address', type: 'email', placeholder: 'Enter your email' }
                ]
            }
        ];

        const chatBox = document.getElementById('chatBox');
        const inputSection = document.getElementById('inputSection');
        const inputWrapper = document.getElementById('inputWrapper');
        const buttonGroup = document.getElementById('buttonGroup');
        const successSection = document.getElementById('successSection');
        const jsonOutput = document.getElementById('jsonOutput');

        // Initial greeting
        function startBot() {
            addBotMessage("Hello, I'm your Final Expense Insurance Assistant. I'm here to help you see how much coverage you may qualify for to help your family with funeral and burial costs. This type of insurance is simple, affordable, and requires no medical exam. I'll ask you a few quick questions to get started.");

            setTimeout(() => {
                showQuestion(0);
            }, 1000);
        }

        function addBotMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.innerHTML = `<div class="message-text">${text}</div>`;
            chatBox.appendChild(messageDiv);
            scrollToBottom();
        }

        function addUserMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `<div class="message-text">${text}</div>`;
            chatBox.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 100);
        }

        function showQuestion(index) {
            const question = questions[index];
            botData.currentStep = index;

            addBotMessage(question.question);

            inputWrapper.innerHTML = '';
            buttonGroup.innerHTML = '';

            if (question.type === 'number') {
                const input = document.createElement('input');
                input.type = 'number';
                input.min = question.min;
                input.max = question.max;
                input.placeholder = `Enter age (${question.min}-${question.max})`;
                inputWrapper.appendChild(input);

                const button = document.createElement('button');
                button.textContent = 'Next';
                button.onclick = () => {
                    if (input.value && input.value >= question.min && input.value <= question.max) {
                        botData[question.key] = input.value;
                        addUserMessage(input.value);
                        if (index < questions.length - 1) {
                            setTimeout(() => showQuestion(index + 1), 500);
                        } else {
                            showCompletion();
                        }
                    } else {
                        alert(`Please enter a valid age between ${question.min} and ${question.max}`);
                    }
                };
                buttonGroup.appendChild(button);
            } else if (question.type === 'choice') {
                question.options.forEach(option => {
                    const button = document.createElement('button');
                    button.textContent = option;
                    button.onclick = () => {
                        botData[question.key] = option;
                        addUserMessage(option);
                        if (index < questions.length - 1) {
                            setTimeout(() => showQuestion(index + 1), 500);
                        } else {
                            showCompletion();
                        }
                    };
                    buttonGroup.appendChild(button);
                });
            } else if (question.type === 'contact') {
                question.fields.forEach(field => {
                    const input = document.createElement('input');
                    input.type = field.type;
                    input.placeholder = field.placeholder;
                    input.id = field.key;
                    inputWrapper.appendChild(input);
                });

                const button = document.createElement('button');
                button.textContent = 'Submit';
                button.style.marginTop = '1rem';
                button.onclick = () => {
                    const fullName = document.getElementById('full_name').value.trim();
                    const phoneNumber = document.getElementById('phone_number').value.trim();
                    const emailAddress = document.getElementById('email_address').value.trim();

                    if (fullName && phoneNumber && emailAddress) {
                        botData.full_name = fullName;
                        botData.phone_number = phoneNumber;
                        botData.email_address = emailAddress;
                        addUserMessage(`${fullName}, ${phoneNumber}, ${emailAddress}`);
                        showCompletion();
                    } else {
                        alert('Please fill in all fields');
                    }
                };
                buttonGroup.appendChild(button);
            }

            scrollToBottom();
        }

        function showCompletion() {
            inputSection.style.display = 'none';
            chatBox.style.display = 'none';

            const cleanData = {
                age: botData.age,
                gender: botData.gender,
                smoker_status: botData.smoker_status,
                health_conditions: botData.health_conditions,
                coverage_amount: botData.coverage_amount,
                full_name: botData.full_name,
                phone_number: botData.phone_number,
                email_address: botData.email_address,
                submission_timestamp: new Date().toISOString()
            };

            jsonOutput.textContent = JSON.stringify(cleanData, null, 2);
            successSection.classList.add('show');

            // Store data locally
            localStorage.setItem('agentBotData', JSON.stringify(cleanData));
            console.log('Bot data saved:', cleanData);
        }

        function copyToClipboard() {
            const jsonText = jsonOutput.textContent;
            navigator.clipboard.writeText(jsonText).then(() => {
                alert('JSON copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        function resetBot() {
            // Reset all data
            Object.keys(botData).forEach(key => {
                botData[key] = null;
            });
            botData.currentStep = 0;

            // Reset UI
            chatBox.innerHTML = '';
            chatBox.style.display = 'flex';
            inputSection.style.display = 'block';
            successSection.classList.remove('show');
            jsonOutput.textContent = '';

            // Start over
            startBot();
        }

        // Start the bot when page loads
        window.addEventListener('load', startBot);
    </script>
</body>
</html>
