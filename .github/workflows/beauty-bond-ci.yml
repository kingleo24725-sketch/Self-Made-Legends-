#
# The equivalent of infra/ci-cd/ci.yml, adjusted for beauty-bond living in a
# subdirectory of this repo. That file was only ever a template ("copy to
# .github/workflows"), so nothing has actually been checked on push until now.
name: Beauty Bond CI

on:
  push:
    paths: ['beauty-bond/**', '.github/workflows/beauty-bond-ci.yml']
  pull_request:
    paths: ['beauty-bond/**', '.github/workflows/beauty-bond-ci.yml']

defaults:
  run:
    working-directory: beauty-bond

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beauty_bond_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/beauty_bond_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beauty-bond/backend/package-lock.json
      - run: npm ci
        working-directory: beauty-bond/backend
      - run: npm run migrate
        working-directory: beauty-bond/backend

      # ── RELEASE BLOCKER ──────────────────────────────────────────
      # A failure here cannot be waived by a product decision. Only fixing
      # the defect clears it. docs/api-reference.md §6.10.
      - name: Safety suite (release blocker)
        run: npm run test:safety
        working-directory: beauty-bond/backend

      - name: Full suite
        run: npx jest --coverage
        working-directory: beauty-bond/backend

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beauty-bond/app/package-lock.json
      - run: npm ci
        working-directory: beauty-bond/app

      # Blocks a release that still carries the placeholder cover art.
      - name: Verify splash / icon / store assets
        run: node scripts/verify-assets.js --release
        working-directory: beauty-bond/app

      - run: npx eslint .
        working-directory: beauty-bond/app

      # The real check that the app compiles. `npm test` is deliberately not
      # run here: there are no app-side tests yet, and jest exits 1 when it
      # finds none, so the template's `npm test --if-present` would have
      # failed this job on day one.
      - name: Bundle for both platforms
        run: npx expo export --platform all --output-dir /tmp/export
        working-directory: beauty-bond/app

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan for a committed live key
        run: |
          # The pattern requires a key-shaped BODY, not just a prefix. The
          # previous version matched on the bare prefix `sk_live_` — and so
          # matched this very line, in every file that documents the scanner.
          # Every CI run since it was added failed on its own source code.
          #
          # Stripe live keys are ~100 chars of [A-Za-z0-9]; a prefix followed
          # by `[` or `|` is a pattern, not a key.
          if git grep -nE '(sk|rk)_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{24,}' -- . ; then
            echo "::error::Possible live secret committed"; exit 1
          fi
