#
# Rebuilds the browser version of the app and commits it into the backend, which
# serves it. Railway redeploys on that commit, so the web app updates itself.
#
# Why the build output is committed rather than generated at deploy time:
# Railway's Root Directory for this service is `backend`, so its build never
# runs anything in `app/`. Committing the export is what lets a plain Node
# service serve a React Native app at all.
#
# The cost of committed build output is drift — it goes stale the moment the app
# changes. That is exactly what this workflow exists to prevent, so it must stay
# on the same trigger as the app itself.
name: Beauty Bond web build

on:
  push:
    branches: [claude/beauty-bond-app-rebuild-u0c50c]
    paths:
      - 'beauty-bond/app/**'
      - '.github/workflows/beauty-bond-web.yml'
  workflow_dispatch:

concurrency:
  group: beauty-bond-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beauty-bond/app/package-lock.json

      - run: npm ci
        working-directory: beauty-bond/app

      - name: Build the web app
        working-directory: beauty-bond/app
        run: |
          rm -rf ../backend/public/web
          npx expo export --platform web --output-dir ../backend/public/web
          # Adds the tags Apple reads. Without them "Add to Home Screen" makes a
          # bookmark that opens Safari with its address bar, not a full-screen
          # app. Idempotent, so re-running is safe.
          node scripts/finish-web-export.js ../backend/public/web

      - name: Check it actually built
        run: |
          cd beauty-bond/backend/public/web
          test -f index.html
          grep -q 'apple-mobile-web-app-capable' index.html
          test -f manifest.webmanifest
          test -f apple-touch-icon.png
          ls _expo/static/js/web/*.js >/dev/null
          echo "Web export looks complete."

      - name: Commit it if it changed
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- beauty-bond/backend/public/web; then
            echo "::notice::Web build is already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beauty-bond/backend/public/web
          # [skip ci] so committing the build does not retrigger this workflow.
          git commit \
            -m "Rebuild the web app [skip ci]" \
            -m "Generated by .github/workflows/beauty-bond-web.yml from ${GITHUB_SHA}." \
            -m "Do not edit by hand - the next app change overwrites it."
          git push
          echo "::notice::Web build updated. Railway redeploys from this commit."
