# Proprietary and confidential. Unauthorized use is prohibited.
#
# Builds an installable Android APK on Expo's servers and emails the owner a
# link. The owner has a phone and no computer, so this exists to make sure no
# step of shipping requires one. docs/get-it-on-your-phone.md.
#
# Two deliberate choices, both about not making a person chase things:
#
#   - It triggers on PUSH, not on a button. Finding "Run workflow" in GitHub's
#     mobile web UI is exactly the kind of step this is meant to remove.
#   - Before EXPO_TOKEN is set it SKIPS and stays green, rather than failing
#     red. A red mark for "setup isn't finished yet" is indistinguishable, at a
#     glance, from "your app is broken", and that is the wrong thing to tell
#     someone. The notice says what to do; workflow_dispatch runs it once the
#     token is in place, with no new commit needed.
name: Beauty Bond Android build

on:
  push:
    branches: [claude/beauty-bond-app-rebuild-u0c50c]
    paths:
      - 'beauty-bond/app/**'
      - '.github/workflows/beauty-bond-android.yml'
  workflow_dispatch:

# Two builds of the same branch race for the same Expo build slot and the
# older one is wasted, so cancel it.
concurrency:
  group: beauty-bond-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The `secrets` context is not available in a job-level `if`, so whether the
  # token exists has to become a job OUTPUT before another job can branch on it.
  # That is the whole reason this job exists.
  setup-check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN found — building the APK."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Waiting for EXPO_TOKEN. Nothing is broken — setup is not finished."
            echo ""
            echo "On a phone browser (NOT the GitHub app — it has no Settings screen):"
            echo "  1. https://expo.dev                          sign up, free"
            echo "  2. https://expo.dev/settings/access-tokens    Create token, copy it"
            echo "  3. Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "       Name:   EXPO_TOKEN"
            echo "       Secret: the token you copied"
            echo ""
            echo "Full walkthrough: beauty-bond/docs/get-it-on-your-phone.md"
          fi

  android:
    needs: setup-check
    if: needs.setup-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Needed to attach the APK to a release. Nothing else is granted.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beauty-bond/app/package-lock.json

      # Gradle runs HERE now (see "Build the APK"), so this runner needs the JDK
      # React Native 0.76 targets. The Android SDK is already preinstalled.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # This installs eas-cli GLOBALLY and puts it on PATH, so the command
      # below is `eas`, not `npx eas`. `npx eas` fails with "could not
      # determine executable to run": npx resolves a LOCAL package named
      # "eas", and no such package exists — the package is "eas-cli" and
      # "eas" is merely its binary. `npx expo` works only because expo IS a
      # local dependency, which is what made the difference easy to miss.
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Confirm eas is on PATH
        run: eas --version

      - run: npm ci
        working-directory: beauty-bond/app

      # 40 seconds here beats 20 minutes of cloud build to discover a bad
      # config plugin, or a native module with no plugin registered at all —
      # which is the failure this app already had. See stripe-flow.md §3.9.
      - name: Generate the native project (catches config errors early)
        run: npx expo prebuild --platform android --no-install
        working-directory: beauty-bond/app

      # app.json ships extra.eas.projectId as "" on purpose — the id belongs to
      # whoever owns the Expo account, not to the repo. --force links this
      # checkout to that account's project; the edit stays in the runner and is
      # never committed. Nothing in the app reads projectId.
      - name: Link the Expo project
        run: eas init --force --non-interactive
        working-directory: beauty-bond/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # --local: run the build on THIS runner rather than on EAS's servers.
      #
      # The cloud build failed with "Gradle build failed with unknown error.
      # See logs for the Run gradlew phase" — and that phase's log lives only
      # on expo.dev, which the environment maintaining this workflow cannot
      # reach. A failure nobody can read is a failure nobody can fix, and
      # relaying it by hand is exactly the loop this whole workflow exists to
      # remove. --local puts every Gradle line in THIS log instead.
      #
      # It is not a downgrade: --local runs the same build steps, and still
      # pulls the SAME keystore from the EAS servers (EXPO_TOKEN below), so
      # builds stay signed by one key and each new APK installs over the last.
      # It also skips the free-tier queue, which cost 45 minutes on the last
      # attempt before Gradle even started.
      #
      # The `preview` profile is what makes this an APK rather than an app
      # bundle: distribution internal, android.buildType apk. An APK installs
      # straight from a link; an .aab cannot be installed at all.
      - name: Build the APK
        run: eas build --platform android --profile preview --local --non-interactive --output "$RUNNER_TEMP/beauty-bond.apk"
        working-directory: beauty-bond/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Check the APK is real
        run: |
          ls -lh "$RUNNER_TEMP/beauty-bond.apk"
          # An APK is a zip. If Gradle produced something malformed, catch it
          # here rather than on a phone that refuses to install it.
          unzip -l "$RUNNER_TEMP/beauty-bond.apk" | grep -q AndroidManifest.xml
          echo "APK looks valid."

      # A workflow artifact needs a GitHub login and arrives as a .zip, which
      # a phone cannot install. A release asset is a direct, tappable file.
      - name: Publish it somewhere tappable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$RUNNER_TEMP/beauty-bond.apk" \
            --title "Beauty Bond — Android" \
            --notes "Tap the .apk below on an Android phone to install. Allow installs from your browser when asked." \
            --target "$GITHUB_SHA" \
            --prerelease
          echo "::notice::APK published. Link: $(gh release view "$TAG" --json url -q .url)"

      - name: Where to get it
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Done. On the Android phone, open this and tap the .apk file:"
          gh release view android-latest --json url -q .url
          echo "Android will ask once whether to allow installs from your browser. Say yes."
